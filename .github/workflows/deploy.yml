# Pull requests: check that the site and the Docker image build.
# Pushes to main (and a weekly rebuild for security patches): build the image, push it to
# GitHub Container Registry, then deploy it to the VPS once the VPS_HOST variable is set.
name: Build and deploy

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Type-check and build the site
        run: |
          npm ci
          npm run build

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Copy the stack files
        run: scp compose.yaml Caddyfile "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/opt/mvmpatron/"

      - name: Pull and restart on the VPS
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            "set -e
             cd /opt/mvmpatron
             docker login ghcr.io -u '${{ github.actor }}' --password-stdin
             sed -i '/^IMAGE=/d' .env
             echo 'IMAGE=${{ env.IMAGE }}:sha-${{ github.sha }}' >> .env
             docker compose pull web
             docker compose up -d --remove-orphans
             docker logout ghcr.io
             docker image prune -f"

      - name: Wait for the new container to be healthy
        run: |
          ssh "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            'cd /opt/mvmpatron
             for i in $(seq 1 12); do
               status=$(docker inspect --format "{{.State.Health.Status}}" $(docker compose ps -q web))
               echo "web: $status"
               [ "$status" = healthy ] && exit 0
               sleep 5
             done
             docker compose logs --tail 50 web
             exit 1'
