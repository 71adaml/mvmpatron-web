    <style>
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }
        
        /* Custom Animations */
        @keyframes ken-burns {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        @keyframes spring-up {
            0% { opacity: 0; transform: translateY(40px) scale(0.95); }
            70% { transform: translateY(-5px) scale(1.01); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes zoom-in {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slide-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-ken-burns {
            animation: ken-burns 15s ease-out forwards;
        }

        .animate-spring-up {
            animation: spring-up 1.2s cubic-bezier(0.2, 0.8, 0.2, 1.1) forwards;
            opacity: 0;
        }

        .animate-in.fade-in {
            animation: fade-in 0.3s ease-out forwards;
        }

        .animate-in.zoom-in-95 {
            animation: zoom-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-in.slide-in-from-bottom-4 {
            animation: slide-up 0.5s ease-out forwards;
        }

        /* Animation Utilities */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: opacity, transform;
        }

        .reveal-active {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        @media (prefers-reduced-motion: reduce) {
            .reveal, .animate-ken-burns, .animate-spring-up, .animate-in {
                transition: none !important;
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
        }

        /* Flip Card Logic */
        .perspective-1000 {
            perspective: 1000px;
        }
        .preserve-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .is-flipped {
            transform: rotateY(180deg);
        }
    </style>
